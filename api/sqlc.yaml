version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - db_type: geography
            nullable: true
            go_type:
              type: string
              pointer: true
